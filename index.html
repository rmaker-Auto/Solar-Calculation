<!DOCTYPE html>

<!-- লগইন পেজ -->
<div id="login" class="login" hidden></div>

<!-- মূল অ্যাপ -->

  </aside>
  <div id="bd" class="bd"></div>
  <div class="mn">

      <button id="mb" class="btn ic" title="সাইডবার দেখান/লুকান">☰</button>
      <div id="av" class="av" title="ছবি বদলান"><img id="avi" alt=""><span class="pen">✎</span></div>

      <select id="hsel" class="hsel" title="প্রোফাইল বদলান"></select>

      <div id="sync" class="pill" title="সিঙ্ক অবস্থা">…</div>
    </header>
    <main id="page"></main>
  </div>
</div>

<!-- PDF/প্রিন্ট রিপোর্টের জন্য -->
<div id="print"></div>

<script src="core.js"></script>

<script>window.addEventListener('DOMContentLoaded',function(){App.boot()})</script>
